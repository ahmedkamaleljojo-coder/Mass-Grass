<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mass &amp; Grass | رسومات مائية مرسومة باليد</title>
<meta name="description" content="Mass &amp; Grass: مرسم ألوان مائية من غزة. لوحات وملصقات وتقويم سنوي وملابس وبطاقات بريدية، كل قطعة مرسومة باليد.">
<link rel="icon" type="image/svg+xml" href="/assets/brand/logo.svg">
<meta name="theme-color" content="#FFFFFF">
<link rel="canonical" href="https://www.massandgrass.com/">
<meta property="og:url" content="https://www.massandgrass.com/">
<meta property="og:image" content="https://www.massandgrass.com/assets/products/postcards/gaza.webp">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Mass & Grass">
<meta property="og:title" content="Mass &amp; Grass">
<meta property="og:description" content="مرسم ألوان مائية من غزة: لوحات وملصقات وتقويم سنوي وملابس وبطاقات بريدية.">
<meta property="og:locale" content="ar_AR">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/css/main.css">
<script>document.documentElement.classList.add('js')</script>
<script src="/assets/js/theme.js"></script>
</head>
<body class="lang-ar">

<!-- shared SVG filters: rough brush edges and torn paper -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="rough" x="-10%" y="-40%" width="120%" height="180%">
    <feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="3" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
  </filter>
  <filter id="deckle" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="4" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="9"/>
  </filter>
  <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency=".6" numOctaves="2" seed="2" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
  </filter>
</svg>

<div class="intro" id="intro" hidden>
  <canvas id="introCanvas"></canvas>
  <div class="intro-word" aria-label="Mass &amp; Grass"><span class="logo-svg" aria-hidden="true"></span></div>
</div>

<header class="site-head">
  <div class="head-in">
    <div class="head-side">
      <a class="head-link" href="/#collections" aria-label="المتجر / Shop">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
        <span data-t="site:ui.shop">المتجر</span>
      </a>
      <button class="head-ico" id="searchBtn" type="button" aria-label="بحث / Search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      </button>
    </div>
    <a class="logo" href="/" aria-label="Mass & Grass">
      <span class="logo-svg" aria-hidden="true"></span>
    </a>
    <div class="head-side head-end">
      <button class="lang-btn" id="langBtn" type="button" aria-label="Switch language / تغيير اللغة">EN</button>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Dark mode / الوضع الداكن" aria-pressed="false">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.3 4.3l1.6 1.6M18.1 18.1l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.3 19.7l1.6-1.6M18.1 5.9l1.6-1.6"/></svg>
      </button>
    </div>
  </div>
  <nav class="nav" id="nav" aria-label="الأقسام"></nav>
  <nav class="chips" id="chips" aria-hidden="true"></nav>
</header>

<main>
  <!-- HERO -->
  <section class="hero">
    <div class="wrap hero-grid">
      <div class="hero-copy">
        <span class="eyebrow" data-t="hero.eyebrow"></span>
        <h1 class="display" data-t="hero.title"></h1>
        <p class="lead" data-t="hero.lead"></p>
        <div class="hero-cta">
          <a class="btn" href="#collections"><span data-t="hero.primary"></span><span class="arw" aria-hidden="true">←</span></a>
          <a class="btn btn-ghost" href="#contact" data-t="hero.secondary"></a>
        </div>
        <div class="facts" id="facts"></div>
      </div>
      <div class="hero-art">
        <div class="sheet" id="sheet">
          <span class="tape t1" aria-hidden="true"></span>
          <span class="tape t2" aria-hidden="true"></span>
          <canvas id="paperBase" aria-hidden="true"></canvas>
          <div id="drops"></div>
          <div class="sheet-foot">
            <span><span class="hint-dot"></span><span id="hint"></span></span>
            <button type="button" id="freshSheet"><span aria-hidden="true">↺</span><span data-t="hero.reset"></span></button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <svg class="stroke" viewBox="0 0 1200 46" preserveAspectRatio="none" aria-hidden="true">
    <path pathLength="1" d="M20 26 C 180 8, 330 40, 520 22 S 860 10, 1000 28 S 1150 30, 1180 20"/>
    <path pathLength="1" d="M60 34 C 260 26, 420 44, 640 32 S 980 24, 1140 34"/>
  </svg>

  <!-- COLLECTIONS -->
  <section class="sec" id="collections">
    <div class="wrap">
      <div class="sec-head rv">
        <span class="eyebrow" data-t="collectionsHead.eyebrow"></span>
        <h2 class="display" data-t="collectionsHead.title"></h2>
        <p data-t="collectionsHead.text"></p>
      </div>
      <div class="cols" id="cols"></div>
    </div>
  </section>

  <!-- JOURNEY: one painting travels across the products -->
  <section class="journey" id="journey" aria-labelledby="jTitle">
    <div class="j-stick">
      <div class="j-grid">
        <div class="j-copy">
          <span class="eyebrow" data-t="journey.eyebrow"></span>
          <h2 class="display" id="jTitle" data-t="journey.title"></h2>
          <p data-t="journey.text"></p>
          <div class="j-stages" id="jStages"></div>
          <div class="j-bar" id="jBar"></div>
        </div>
        <div class="j-scene" id="jScene">
          <div class="j-art" id="jArt" role="img" aria-label="Watercolour painting"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- CALENDAR -->
  <section class="sec" id="calendar">
    <div class="wrap cal-grid">
      <div class="cal-copy rv">
        <span class="eyebrow" data-t="calendar.eyebrow"></span>
        <h2 class="display" data-t="calendar.title"></h2>
        <span class="status" data-t="calendar.status"></span>
        <p data-t="calendar.text"></p>
        <div class="months" id="months" role="group"></div>
        <div><a class="btn" href="#contact"><span data-t="calendar.cta"></span><span class="arw" aria-hidden="true">←</span></a></div>
      </div>
      <div class="calendar rv" style="--rd:.15s">
        <div class="cal-art"><canvas id="calCanvas" aria-hidden="true"></canvas></div>
        <div class="cal-head"><b id="calMonth"></b><span id="calYear"></span></div>
        <div class="days" id="calDays"></div>
      </div>
    </div>
  </section>

  <svg class="stroke" viewBox="0 0 1200 46" preserveAspectRatio="none" aria-hidden="true" style="--c:var(--sage)">
    <path pathLength="1" d="M30 20 C 220 38, 380 6, 600 24 S 940 40, 1170 18"/>
  </svg>

  <!-- PROCESS -->
  <section class="sec" id="process">
    <div class="wrap">
      <div class="sec-head rv">
        <span class="eyebrow" data-t="process.eyebrow"></span>
        <h2 class="display" data-t="process.title"></h2>
      </div>
      <ol class="steps" id="steps" style="list-style:none;margin:0;padding:0"></ol>
    </div>
  </section>

  <!-- STORY -->
  <section class="sec" id="story">
    <div class="wrap story rv">
      <span class="eyebrow" data-t="story.eyebrow"></span>
      <blockquote data-t="story.quote"></blockquote>
      <p data-t="story.text"></p>
      <a class="btn btn-ghost" href="/story/"><span data-t="story.cta"></span><span class="arw" aria-hidden="true">←</span></a>
    </div>
  </section>
</main>

<footer class="foot" id="contact">
  <div class="wrap">
    <div class="foot-grid">
      <div>
        <a class="logo" href="/" aria-label="Mass & Grass"><span class="logo-svg" aria-hidden="true"></span></a>
        <p data-t="footer.note"></p>
      </div>
      <div>
        <h4 data-t="footer.browse"></h4>
        <ul id="footCols"></ul>
      </div>
      <div>
        <h4 data-t="footer.contact"></h4>
        <ul id="footContact"></ul>
      </div>
    </div>
    <div class="foot-bottom"><span>© <span id="yr"></span> Mass &amp; Grass</span><span data-t="site:brand.tagline"></span></div>
  </div>
</footer>

<div class="brush" id="brush" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/assets/js/watercolor.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/search.js"></script>
</body>
</html>
