<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الصفحة غير موجودة | Mass &amp; Grass</title>
<link rel="icon" type="image/svg+xml" href="/assets/brand/logo.svg">
<meta name="theme-color" content="#F2EFE8">
<meta name="robots" content="noindex">
<link rel="preload" href="/assets/fonts/thmanyah-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/main.css">
<script>document.documentElement.classList.add('js')</script>
<script src="/assets/js/theme.js"></script>
<style>.nf-in{min-height:60vh;display:grid;place-content:center;justify-items:center;gap:18px;text-align:center;padding-block:60px}.nf h1{font-size:clamp(2rem,5vw,3.4rem)}.nf-blot{width:120px;aspect-ratio:1;border-radius:46% 54% 52% 48%/54% 44% 56% 46%;background:var(--clay);opacity:.3;filter:url(#rough)}</style>
</head>
<body class="lang-ar" data-page="404">

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="rough" x="-10%" y="-40%" width="120%" height="180%">
    <feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="3" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
  </filter>
  <filter id="deckle" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="4" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="9"/>
  </filter>
  <!-- wooden clothes peg -->
  <symbol id="peg" viewBox="0 0 28 70">
    <path d="M4 2 H13 L12 68 H6 Q3 68 3 64 Z" fill="#C8A274"/>
    <path d="M15 2 H24 L25 64 Q25 68 22 68 H16 Z" fill="#B88F60"/>
    <path d="M13 2 V68 M15 2 V68" stroke="#8C6A45" stroke-width="1"/>
    <path d="M6 10 H11 M17 10 H22" stroke="#9A7650" stroke-width="1" opacity=".6"/>
    <rect x="2" y="26" width="24" height="7" rx="3.5" fill="#8B8680"/>
    <rect x="2" y="27" width="24" height="2" rx="1" fill="#C9C4BC"/>
  </symbol>
</svg>

<header class="site-head" id="siteHead">
  <div class="brand-row">
    <div class="head-start">
      <button class="menu-btn" id="menuBtn" type="button" aria-controls="menu" aria-expanded="false" aria-label="القائمة / Menu"><span></span><span></span><span></span></button>
      <a class="head-link" href="/story/" data-t="site:ui.story"></a>
    </div>
    <a class="logo" href="/" aria-label="Mass & Grass"><span class="logo-svg" aria-hidden="true"></span></a>
    <div class="head-end">
      <button class="lang-btn" id="langBtn" type="button" aria-label="Switch language / تغيير اللغة">EN</button>
    </div>
  </div>
</header>
<nav class="nav-row" id="navRow" aria-label="الأقسام">
  <div class="nav-row-in">
    <a class="nav-mark" href="/" aria-label="Mass & Grass" tabindex="-1"><span class="logo-svg" aria-hidden="true"></span></a>
    <div class="nav" id="nav"></div>
  </div>
</nav>

<main class="nf">
  <div class="wrap nf-in">
    <span class="nf-blot" aria-hidden="true"></span>
    <h1 class="display" data-t="site:ui.nf.title"></h1>
    <p class="lead" data-t="site:ui.nf.text"></p>
    <a class="btn" href="/" data-t="site:ui.nf.home"></a>
  </div>
</main>

<footer class="foot" id="contact">
  <div class="wrap foot-in">
    <a class="logo" href="/" aria-label="Mass & Grass"><span class="logo-svg" aria-hidden="true"></span></a>
    <p class="foot-note" id="footNote"></p>
    <nav class="foot-nav" id="footCols" aria-label="الأقسام"></nav>
    <ul class="foot-contact" id="footContact"></ul>
    <div class="foot-bottom">
      <span>© <span id="yr"></span> Mass &amp; Grass</span>
      <button class="theme-toggle" id="themeBtn" data-theme-toggle type="button" aria-label="Dark mode / الوضع الداكن" aria-pressed="false">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.3 4.3l1.6 1.6M18.1 18.1l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.3 19.7l1.6-1.6M18.1 5.9l1.6-1.6"/></svg>
      </button>
    </div>
  </div>
</footer>

<!-- painting details -->
<dialog class="plb" id="plb" aria-labelledby="plbTitle">
  <div class="plb-in">
    <button class="plb-x" type="button" id="plbClose"><span aria-hidden="true">✕</span><span class="sr-only" data-t="page.close"></span></button>
    <figure class="plb-fig">
      <div class="plb-paper"><img id="plbImg" alt=""></div>
      <figcaption id="plbNote"></figcaption>
    </figure>
    <div class="plb-body">
      <span class="eyebrow" id="plbSeries"></span>
      <h3 class="display" id="plbTitle"></h3>
      <p id="plbStory"></p>
      <dl class="specs" id="plbSpecs"></dl>
      <div class="plb-acts">
        <a class="btn" id="plbOrder" href="#order"><span data-t="page.order"></span></a>
        <button class="btn btn-ghost" type="button" id="plbLine" data-t="page.showOnLine"></button>
      </div>
      <div class="plb-nav">
        <button class="arrow" type="button" id="plbPrev"><span aria-hidden="true">→</span><span class="sr-only" data-t="page.prev"></span></button>
        <button class="arrow" type="button" id="plbNext"><span aria-hidden="true">←</span><span class="sr-only" data-t="page.next"></span></button>
      </div>
    </div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/assets/js/watercolor.js"></script>
<script src="/assets/js/shell.js"></script>
</body>
</html>
