<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بطاقات من البلاد (زجاج أبيض) | Mass &amp; Grass</title>
<meta name="description" content="بوست كارد من Mass & Grass: ثماني رسومات مائية لثماني مدن، كل بطاقة بختم مدينتها، واكتبي عليها رسالتك.">
<meta name="theme-color" content="#F7F3EE">
<meta name="mg-content" content="postcards">
<meta property="og:title" content="بطاقات من البلاد | Mass & Grass">
<meta property="og:description" content="ثماني رسومات مائية لثماني مدن.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/assets/css/main.css">
<link rel="stylesheet" href="/assets/css/postcards.css">
<link rel="stylesheet" href="/assets/css/glass.css">
<script>document.documentElement.dataset.skin = 'glass-white'</script>
<script>document.documentElement.classList.add('js')</script>
<script src="/assets/js/theme.js"></script>
</head>
<body class="lang-ar" data-page="postcards">

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="rough" x="-10%" y="-40%" width="120%" height="180%">
    <feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="3" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
  </filter>
  <filter id="deckle" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="4" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
  </filter>
</svg>

<header class="site-head">
  <div class="head-in">
    <a class="logo" href="/" aria-label="Mass & Grass">
      <canvas class="logo-mark" id="logoMark" width="84" height="84" aria-hidden="true"></canvas>
      <span class="logo-word">Mass <i>&amp;</i> Grass</span>
    </a>
    <nav class="nav" id="nav" aria-label="الأقسام"></nav>
    <div class="head-act">
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Dark mode / الوضع الداكن" aria-pressed="false">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.3 4.3l1.6 1.6M18.1 18.1l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.3 19.7l1.6-1.6M18.1 5.9l1.6-1.6"/></svg>
      </button>
      <button class="lang-btn" id="langBtn" type="button" aria-label="Switch language / تغيير اللغة">EN</button>
      <a class="btn" href="#contact" data-contact></a>
    </div>
  </div>
  <nav class="chips" id="chips" aria-label="الأقسام"></nav>
</header>

<main>
  <!-- 1. the envelope: the cards come out of it in a fan -->
  <section class="env-sec" id="env" aria-labelledby="pcTitle">
    <div class="wrap env-head">
      <span class="eyebrow" data-t="page.eyebrow"></span>
      <h1 class="display" id="pcTitle"></h1>
      <p class="lead" data-t="page.lead"></p>
    </div>
    <div class="env-stage" id="stage" tabindex="0" aria-label="الظرف">
      <img class="env-back" src="/assets/products/postcards/envelope-back.webp" alt="" aria-hidden="true" draggable="false">
      <div class="fan" id="fan"></div>
      <img class="env-front" src="/assets/products/postcards/envelope-front.webp" alt="" aria-hidden="true" draggable="false">
    </div>
    <div class="env-acts">
      <button class="arrow" id="envPrev" type="button"><span aria-hidden="true">→</span><span class="sr-only" data-t="page.prev"></span></button>
      <button class="btn btn-ghost" id="envBtn" type="button" aria-pressed="false"></button>
      <button class="arrow" id="envNext" type="button"><span aria-hidden="true">←</span><span class="sr-only" data-t="page.next"></span></button>
      <span class="env-hint" id="envHint" data-t="page.fanHint"></span>
    </div>
  </section>

  <svg class="stroke" viewBox="0 0 1200 46" preserveAspectRatio="none" aria-hidden="true" style="--c:var(--slate)">
    <path pathLength="1" d="M20 26 C 180 8, 330 40, 520 22 S 860 10, 1000 28 S 1150 30, 1180 20"/>
  </svg>

  <!-- 2. write your message on the back -->
  <section class="sec write" id="write" aria-labelledby="writeTitle">
    <div class="wrap write-grid">
      <div class="write-card">
        <div class="pcard big" id="wCard"><div class="pc-in"><div class="face front"><img alt=""></div><div class="face back"></div></div></div>
        <button class="btn btn-ghost" id="wFlip" type="button"></button>
      </div>
      <div class="write-form">
        <span class="eyebrow" data-t="page.writeEyebrow"></span>
        <h2 class="display" id="writeTitle" data-t="page.writeTitle"></h2>
        <p class="write-lead" data-t="page.writeText"></p>
        <div class="grp"><span class="lbl" data-t="page.pickCard"></span><div class="picks" id="wCards" role="radiogroup"></div></div>
        <div class="grp"><span class="lbl" data-t="page.pickStamp"></span><div class="picks stamps" id="wStamps" role="radiogroup"></div></div>
        <label class="grp"><span class="lbl" data-t="page.to"></span><input id="wTo" type="text" maxlength="40" autocomplete="off"></label>
        <label class="grp"><span class="lbl"><span data-t="page.writeTitle"></span> <small id="wCount"></small></span><textarea id="wMsg" rows="4" maxlength="220"></textarea></label>
        <label class="grp"><span class="lbl" data-t="page.from"></span><input id="wFrom" type="text" maxlength="30" autocomplete="off"></label>
        <a class="btn" id="wOrder" href="#order"><span data-t="page.order"></span></a>
        <p class="note" data-t="page.sizeText"></p>
      </div>
    </div>
  </section>

  <!-- 3. all the cards -->
  <section class="sec" id="all">
    <div class="wrap">
      <div class="sec-head rv">
        <span class="eyebrow" data-t="page.allEyebrow"></span>
        <h2 class="display" data-t="page.allTitle"></h2>
        <p data-t="page.allText"></p>
      </div>
      <div class="grid" id="grid"></div>
      <div class="set-row"><a class="btn" id="setOrder" href="#order"><span data-t="page.orderSet"></span></a><p class="note" data-t="page.sampleNote"></p></div>
    </div>
  </section>
</main>

<!-- one card, large: turn it over, go to the next -->
<dialog class="pv" id="pv" aria-labelledby="pvTitle">
  <div class="pv-in">
    <button class="pv-x" id="pvX" type="button"><span aria-hidden="true">✕</span><span class="sr-only" data-t="page.close"></span></button>
    <div class="pcard big" id="pvCard" tabindex="0"><div class="pc-in"><div class="face front"><img alt=""></div><div class="face back"></div></div></div>
    <div class="pv-body">
      <span class="eyebrow" id="pvCity"></span>
      <h3 class="display" id="pvTitle"></h3>
      <p id="pvNote"></p>
      <div class="pv-acts">
        <button class="btn btn-ghost" id="pvFlip" type="button" data-t="page.flip"></button>
        <button class="btn btn-ghost" id="pvWrite" type="button" data-t="page.writeThis"></button>
        <a class="btn" id="pvOrder" href="#order"><span data-t="page.order"></span></a>
        <span class="pv-nav">
          <button class="arrow" id="pvPrev" type="button"><span aria-hidden="true">→</span><span class="sr-only" data-t="page.prev"></span></button>
          <button class="arrow" id="pvNext" type="button"><span aria-hidden="true">←</span><span class="sr-only" data-t="page.next"></span></button>
        </span>
      </div>
    </div>
  </div>
</dialog>

<footer class="foot" id="contact">
  <div class="wrap">
    <div class="foot-grid">
      <div>
        <a class="logo" href="/" aria-label="Mass & Grass"><span class="logo-word">Mass <i>&amp;</i> Grass</span></a>
        <p id="footNote"></p>
      </div>
      <div><h4 data-t="site:ui.browse"></h4><ul id="footCols"></ul></div>
      <div><h4 data-t="site:ui.contactTitle"></h4><ul id="footContact"></ul></div>
    </div>
    <div class="foot-bottom"><span>© <span id="yr"></span> Mass &amp; Grass</span><span id="footTag"></span></div>
  </div>
</footer>


<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/assets/js/watercolor.js"></script>
<script src="/assets/js/shell.js"></script>
<script src="/assets/js/postcards.js"></script>
</body>
</html>
