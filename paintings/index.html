<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحات | Mass &amp; Grass</title>
<meta name="description" content="لوحات مائية أصلية وطبعات فنية من Mass & Grass، مرسومة يدوياً على ورق قطني.">
<link rel="icon" type="image/svg+xml" href="/assets/brand/logo.svg">
<meta name="theme-color" content="#FFFFFF">
<meta name="mg-content" content="paintings">
<meta property="og:title" content="لوحات | Mass & Grass">
<meta property="og:description" content="لوحات مائية أصلية وطبعات فنية، مرسومة يدوياً على ورق قطني.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/assets/css/main.css">
<link rel="stylesheet" href="/assets/css/paintings.css">
<script>document.documentElement.classList.add('js')</script>
<script src="/assets/js/theme.js"></script>
</head>
<body class="lang-ar" data-page="paintings">

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="rough" x="-10%" y="-40%" width="120%" height="180%">
    <feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="3" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
  </filter>
  <filter id="deckle" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="4" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="9"/>
  </filter>
  <!-- wooden clothes peg -->
  <symbol id="peg" viewBox="0 0 28 70">
    <path d="M4 2 H13 L12 68 H6 Q3 68 3 64 Z" fill="#C8A274"/>
    <path d="M15 2 H24 L25 64 Q25 68 22 68 H16 Z" fill="#B88F60"/>
    <path d="M13 2 V68 M15 2 V68" stroke="#8C6A45" stroke-width="1"/>
    <path d="M6 10 H11 M17 10 H22" stroke="#9A7650" stroke-width="1" opacity=".6"/>
    <rect x="2" y="26" width="24" height="7" rx="3.5" fill="#8B8680"/>
    <rect x="2" y="27" width="24" height="2" rx="1" fill="#C9C4BC"/>
  </symbol>
</svg>

<header class="site-head">
  <div class="head-in">
    <a class="logo" href="/" aria-label="Mass & Grass">
      <span class="logo-svg" aria-hidden="true"></span>
    </a>
    <nav class="nav" id="nav" aria-label="الأقسام"></nav>
    <div class="head-act">
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Dark mode / الوضع الداكن" aria-pressed="false">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.3 4.3l1.6 1.6M18.1 18.1l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.3 19.7l1.6-1.6M18.1 5.9l1.6-1.6"/></svg>
      </button>
      <button class="lang-btn" id="langBtn" type="button" aria-label="Switch language / تغيير اللغة">EN</button>
      <a class="btn" href="#contact" data-contact></a>
    </div>
  </div>
  <nav class="chips" id="chips" aria-label="الأقسام"></nav>
</header>

<main>
  <!-- THE LINE -->
  <section class="line-sec" aria-labelledby="lineTitle">
    <div class="wrap line-head">
      <span class="eyebrow" data-t="page.eyebrow"></span>
      <h1 class="display" id="lineTitle" data-t="page.title"></h1>
      <p class="lead" data-t="page.lead"></p>
    </div>

    <div class="line-stage" id="stage" tabindex="0" role="region" aria-roledescription="carousel" aria-labelledby="lineTitle">
      <div class="ghost" id="ghost" aria-hidden="true"></div>
      <svg class="rope" id="rope" aria-hidden="true"><path class="rope-sh"/><path class="rope-main"/><path class="rope-hi"/></svg>
      <div class="hangs" id="hangs"></div>
      <span class="drag-hint" id="dragHint"><span aria-hidden="true">⟷</span> <span data-t="page.hint"></span></span>
    </div>

    <div class="wrap line-info">
      <div class="li-text" aria-live="polite">
        <div class="li-count" id="count"></div>
        <h2 class="li-title" id="curTitle"></h2>
        <p class="li-meta" id="curMeta"></p>
        <div class="li-tags" id="curTags"></div>
      </div>
      <div class="li-acts">
        <div class="li-arrows">
          <button class="arrow" id="prevBtn" type="button"><span aria-hidden="true">→</span><span class="sr-only" data-t="page.prev"></span></button>
          <button class="arrow" id="nextBtn" type="button"><span aria-hidden="true">←</span><span class="sr-only" data-t="page.next"></span></button>
        </div>
        <button class="btn btn-ghost" id="detailBtn" type="button" data-t="page.details"></button>
        <a class="btn" id="orderBtn" href="#order"><span data-t="page.order"></span></a>
      </div>
    </div>
    <div class="wrap"><div class="pins" id="pins" role="tablist"></div></div>
  </section>

  <svg class="stroke" viewBox="0 0 1200 46" preserveAspectRatio="none" aria-hidden="true">
    <path pathLength="1" d="M20 26 C 180 8, 330 40, 520 22 S 860 10, 1000 28 S 1150 30, 1180 20"/>
  </svg>

  <!-- ALL PAINTINGS -->
  <section class="sec" id="all">
    <div class="wrap">
      <div class="sec-head rv">
        <span class="eyebrow" data-t="page.allEyebrow"></span>
        <h2 class="display" data-t="page.allTitle"></h2>
        <p data-t="page.allText"></p>
      </div>
      <div class="filters" id="filters" role="group"></div>
      <div class="pgrid" id="pgrid"></div>
    </div>
  </section>
</main>

<footer class="foot" id="contact">
  <div class="wrap">
    <div class="foot-grid">
      <div>
        <a class="logo" href="/" aria-label="Mass & Grass"><span class="logo-svg" aria-hidden="true"></span></a>
        <p id="footNote"></p>
      </div>
      <div><h4 data-t="site:ui.browse"></h4><ul id="footCols"></ul></div>
      <div><h4 data-t="site:ui.contactTitle"></h4><ul id="footContact"></ul></div>
    </div>
    <div class="foot-bottom"><span>© <span id="yr"></span> Mass &amp; Grass</span><span id="footTag"></span></div>
  </div>
</footer>

<!-- painting details -->
<dialog class="plb" id="plb" aria-labelledby="plbTitle">
  <div class="plb-in">
    <button class="plb-x" type="button" id="plbClose"><span aria-hidden="true">✕</span><span class="sr-only" data-t="page.close"></span></button>
    <figure class="plb-fig">
      <div class="plb-paper"><img id="plbImg" alt=""></div>
      <figcaption id="plbNote"></figcaption>
    </figure>
    <div class="plb-body">
      <span class="eyebrow" id="plbSeries"></span>
      <h3 class="display" id="plbTitle"></h3>
      <p id="plbStory"></p>
      <dl class="specs" id="plbSpecs"></dl>
      <div class="plb-acts">
        <a class="btn" id="plbOrder" href="#order"><span data-t="page.order"></span></a>
        <button class="btn btn-ghost" type="button" id="plbLine" data-t="page.showOnLine"></button>
      </div>
      <div class="plb-nav">
        <button class="arrow" type="button" id="plbPrev"><span aria-hidden="true">→</span><span class="sr-only" data-t="page.prev"></span></button>
        <button class="arrow" type="button" id="plbNext"><span aria-hidden="true">←</span><span class="sr-only" data-t="page.next"></span></button>
      </div>
    </div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/assets/js/watercolor.js"></script>
<script src="/assets/js/shell.js"></script>
<script src="/assets/js/paintings.js"></script>
</body>
</html>
