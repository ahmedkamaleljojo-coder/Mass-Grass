<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>السلة | Mass &amp; Grass</title>
<meta name="description" content="سلة Mass &amp; Grass.">
<link rel="icon" type="image/svg+xml" href="/assets/brand/logo.svg">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<meta name="mg-content" content="shop,paintings,stickers,calendar,cloth,postcards">
<link rel="canonical" href="https://www.massandgrass.com/cart/">
<meta property="og:url" content="https://www.massandgrass.com/cart/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Mass &amp; Grass">
<meta property="og:image" content="https://www.massandgrass.com/assets/products/paintings/held-4x5.webp">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:title" content="السلة | Mass &amp; Grass">
<meta property="og:description" content="سلة Mass &amp; Grass.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/css/main.css">
<link rel="stylesheet" href="/assets/css/shop.css">
<script>document.documentElement.classList.add('js')</script>
<script src="/assets/js/theme.js"></script>
</head>
<body class="lang-ar" data-page="cart">

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="rough" x="-10%" y="-40%" width="120%" height="180%">
    <feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="3" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
  </filter>
</svg>

<header class="site-head">
  <div class="head-in">
    <div class="head-side">
      <a class="head-link cart-link" id="cartBtn" href="/cart/" aria-label="السلة / Basket">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
        <span data-t="site:ui.cart.title">السلة</span><b class="cart-n" hidden>0</b>
      </a>
      <button class="head-ico" id="searchBtn" type="button" aria-label="بحث / Search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      </button>
    </div>
    <a class="logo" href="/" aria-label="Mass & Grass">
      <span class="logo-svg" aria-hidden="true"></span>
    </a>
    <div class="head-side head-end">
      <button class="lang-btn" id="langBtn" type="button" aria-label="Switch language / تغيير اللغة">EN</button>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Dark mode / الوضع الداكن" aria-pressed="false">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.3 4.3l1.6 1.6M18.1 18.1l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.3 19.7l1.6-1.6M18.1 5.9l1.6-1.6"/></svg>
      </button>
    </div>
  </div>
  <nav class="nav" id="nav" aria-label="الأقسام"></nav>
  <nav class="chips" id="chips" aria-hidden="true"></nav>
</header>

<main>
  <section class="wrap shop-head">
    <h1 class="display" data-t="cart.title"></h1>
  </section>
  <section class="wrap cart" id="cart">
    <div class="cart-list" id="cartList"></div>
    <aside class="cart-sum" id="cartSum" aria-labelledby="sumTitle"></aside>
  </section>
</main>

<footer class="foot" id="contact">
  <div class="wrap">
    <div class="foot-grid">
      <div>
        <a class="logo" href="/" aria-label="Mass & Grass"><span class="logo-svg" aria-hidden="true"></span></a>
        <p id="footNote"></p>
      </div>
      <div><h4 data-t="site:ui.browse"></h4><ul id="footCols"></ul></div>
      <div><h4 data-t="site:ui.contactTitle"></h4><ul id="footContact"></ul></div>
    </div>
    <div class="foot-bottom"><span>© <span id="yr"></span> Mass &amp; Grass</span><span id="footTag"></span></div>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/assets/js/watercolor.js"></script>
<script src="/assets/js/shell.js"></script>
<script src="/assets/js/catalog.js"></script>
<script src="/assets/js/cart.js"></script>
<script src="/assets/js/search.js"></script>
<script src="/assets/js/basket.js"></script>
</body>
</html>
