<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>هوديز وبلايز | Mass &amp; Grass</title>
<meta name="description" content="هوديز وبلايز قطنية بطبعات من رسومات Mass & Grass المائية.">
<meta name="theme-color" content="#F2E8D8">
<meta name="mg-content" content="hoodies">
<meta property="og:title" content="هوديز وبلايز | Mass & Grass">
<meta property="og:description" content="هوديز وبلايز قطنية بطبعات من رسوماتنا المائية.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/assets/css/main.css">
<link rel="stylesheet" href="/assets/css/hoodies.css">
<script>document.documentElement.classList.add('js')</script>
</head>
<body class="lang-ar" data-page="hoodies">

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="rough" x="-10%" y="-40%" width="120%" height="180%">
    <feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="3" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
  </filter>
  <filter id="deckle" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="4" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
  </filter>
</svg>

<header class="site-head">
  <div class="head-in">
    <a class="logo" href="/" aria-label="Mass & Grass">
      <canvas class="logo-mark" id="logoMark" width="84" height="84" aria-hidden="true"></canvas>
      <span class="logo-word">Mass <i>&amp;</i> Grass</span>
    </a>
    <nav class="nav" id="nav" aria-label="الأقسام"></nav>
    <div class="head-act">
      <button class="lang-btn" id="langBtn" type="button" aria-label="Switch language / تغيير اللغة">EN</button>
      <a class="btn" href="#contact" data-contact></a>
    </div>
  </div>
  <nav class="chips" id="chips" aria-label="الأقسام"></nav>
</header>

<main>
  <section class="wr" id="wr" aria-labelledby="wrTitle">
    <div class="wrap wr-head">
      <div>
        <span class="eyebrow" data-t="page.eyebrow"></span>
        <h1 class="display" id="wrTitle" data-t="page.title"></h1>
      </div>
      <div class="wr-count" id="count"></div>
    </div>

    <!-- the rail: every piece hangs here; the one taken down leaves an empty hook -->
    <div class="rail-row">
      <span class="rail-bar" aria-hidden="true"></span>
      <div class="minis" id="minis" role="tablist"></div>
    </div>

    <div class="stage" id="stage">
      <canvas class="bloom" id="bloomA" aria-hidden="true"></canvas>
      <canvas class="bloom" id="bloomB" aria-hidden="true"></canvas>
      <div class="ghost" id="ghost" aria-hidden="true"></div>

      <div class="piece-wrap" id="pieceWrap" role="img"></div>

      <div class="info" aria-live="polite">
        <span class="kick" id="kick"></span>
        <h2 class="display" id="name"></h2>
        <p class="story" id="story"></p>
        <div class="opt">
          <span class="opt-l"><span data-t="page.color"></span>: <b id="colorName"></b></span>
          <div class="swatches" id="swatches" role="radiogroup"></div>
        </div>
        <div class="opt">
          <span class="opt-l" data-t="page.size"></span>
          <div class="sizes" id="sizes" role="radiogroup"></div>
        </div>
        <div class="acts">
          <a class="btn" id="orderBtn" href="#contact" target="_blank" rel="noopener"><span data-t="page.order"></span></a>
          <button class="btn btn-ghost" id="detailBtn" type="button" data-t="page.details"></button>
        </div>
        <div class="nav-arrows">
          <button class="arrow" id="prevBtn" type="button"><span aria-hidden="true">→</span><span class="sr-only" data-t="page.prev"></span></button>
          <button class="arrow" id="nextBtn" type="button"><span aria-hidden="true">←</span><span class="sr-only" data-t="page.next"></span></button>
          <span class="timer" aria-hidden="true"><i id="timerBar"></i></span>
        </div>
      </div>

      <button class="print-card" id="printCard" type="button">
        <span class="pc-paper"><img id="printImg" alt=""></span>
        <span class="pc-cap"><span data-t="page.artwork"></span><i data-t="page.zoom"></i></span>
      </button>
    </div>
  </section>

  <svg class="stroke" viewBox="0 0 1200 46" preserveAspectRatio="none" aria-hidden="true" style="--c:var(--umber)">
    <path pathLength="1" d="M20 26 C 180 8, 330 40, 520 22 S 860 10, 1000 28 S 1150 30, 1180 20"/>
  </svg>

  <section class="sec" id="collection">
    <div class="wrap">
      <div class="sec-head rv">
        <span class="eyebrow" data-t="page.allEyebrow"></span>
        <h2 class="display" data-t="page.allTitle"></h2>
        <p data-t="page.allText"></p>
      </div>
      <div class="cards" id="cards"></div>
    </div>
  </section>
</main>

<footer class="foot" id="contact">
  <div class="wrap">
    <div class="foot-grid">
      <div>
        <a class="logo" href="/" aria-label="Mass & Grass"><span class="logo-word">Mass <i>&amp;</i> Grass</span></a>
        <p id="footNote"></p>
      </div>
      <div><h4 data-t="site:ui.browse"></h4><ul id="footCols"></ul></div>
      <div><h4 data-t="site:ui.contactTitle"></h4><ul id="footContact"></ul></div>
    </div>
    <div class="foot-bottom"><span>© <span id="yr"></span> Mass &amp; Grass</span><span id="footTag"></span></div>
  </div>
</footer>

<!-- painting + piece side by side -->
<dialog class="lb" id="lb" aria-labelledby="lbName">
  <div class="lb-in">
    <button class="lb-x" id="lbClose" type="button"><span aria-hidden="true">✕</span><span class="sr-only" data-t="page.close"></span></button>
    <div class="lb-panes">
      <figure class="lb-pane art"><span class="tag" data-t="page.artwork"></span><span class="lb-paper"><img id="lbArt" alt=""></span></figure>
      <figure class="lb-pane"><span class="tag" data-t="page.onGarment"></span><img id="lbPiece" alt=""></figure>
    </div>
    <div class="lb-body">
      <span class="kick" id="lbKick"></span>
      <h3 class="display" id="lbName"></h3>
      <p id="lbStory"></p>
      <dl class="specs" id="lbSpecs"></dl>
      <p class="note" id="lbNote"></p>
      <a class="btn" id="lbOrder" href="#contact" target="_blank" rel="noopener"><span data-t="page.order"></span></a>
    </div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/assets/js/watercolor.js"></script>
<script src="/assets/js/shell.js"></script>
<script src="/assets/js/hoodies.js"></script>
</body>
</html>
