<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الملصقات | Mass &amp; Grass</title>
<meta name="description" content="ملصقات مقصوصة من رسومات Mass &amp; Grass المائية.">
<link rel="icon" type="image/svg+xml" href="/assets/brand/logo.svg">
<meta name="theme-color" content="#FFFFFF">
<meta name="mg-content" content="stickers">
<link rel="canonical" href="https://www.massandgrass.com/stickers/">
<meta property="og:url" content="https://www.massandgrass.com/stickers/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Mass &amp; Grass">
<meta property="og:image" content="https://www.massandgrass.com/assets/products/stickers/objects/notebook.webp">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:title" content="الملصقات | Mass &amp; Grass">
<meta property="og:description" content="ملصقات مقصوصة من رسوماتنا المائية.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/css/main.css">
<link rel="stylesheet" href="/assets/css/stickers.css">
<script>document.documentElement.classList.add('js')</script>
<script src="/assets/js/theme.js"></script>
</head>
<body class="lang-ar" data-page="stickers">

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="rough" x="-10%" y="-40%" width="120%" height="180%">
    <feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="3" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
  </filter>
  <filter id="deckle" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="4" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
  </filter>
</svg>

<header class="site-head">
  <div class="head-in">
    <div class="head-side">
      <a class="head-link" href="/#collections" aria-label="المتجر / Shop">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
        <span data-t="site:ui.shop">المتجر</span>
      </a>
      <button class="head-ico" id="searchBtn" type="button" aria-label="بحث / Search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      </button>
    </div>
    <a class="logo" href="/" aria-label="Mass & Grass">
      <span class="logo-svg" aria-hidden="true"></span>
    </a>
    <div class="head-side head-end">
      <button class="lang-btn" id="langBtn" type="button" aria-label="Switch language / تغيير اللغة">EN</button>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Dark mode / الوضع الداكن" aria-pressed="false">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.3 4.3l1.6 1.6M18.1 18.1l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.3 19.7l1.6-1.6M18.1 5.9l1.6-1.6"/></svg>
      </button>
    </div>
  </div>
  <nav class="nav" id="nav" aria-label="الأقسام"></nav>
  <nav class="chips" id="chips" aria-hidden="true"></nav>
</header>

<main>
  <!-- 1. a sticker is born: painted, cut, peeled -->
  <section class="born" aria-labelledby="bornTitle">
    <div class="wrap born-grid">
      <div class="born-copy">
        <span class="eyebrow" data-t="page.eyebrow"></span>
        <h1 class="display" id="bornTitle"></h1>
        <p class="lead" data-t="page.lead"></p>
        <ol class="steps" id="steps" aria-hidden="true">
          <li data-s="paint"><i></i><span data-t="page.stepPaint"></span></li>
          <li data-s="cut"><i></i><span data-t="page.stepCut"></span></li>
          <li data-s="peel"><i></i><span data-t="page.stepPeel"></span></li>
        </ol>
        <div class="born-acts">
          <a class="btn" href="#try"><span data-t="page.tryIt"></span><span class="arw" aria-hidden="true">←</span></a>
          <button class="btn btn-ghost" id="againBtn" type="button" data-t="page.again"></button>
        </div>
      </div>
      <div class="born-stage" id="bornStage">
        <div class="born-paper">
          <canvas id="bornCanvas" aria-hidden="true"></canvas>
          <div class="born-stk" id="bornStk"><img alt="" draggable="false"><i class="sheen"></i></div>
        </div>
        <span class="born-name" id="bornName"></span>
      </div>
    </div>
  </section>

  <svg class="stroke" viewBox="0 0 1200 46" preserveAspectRatio="none" aria-hidden="true" style="--c:var(--rose)">
    <path pathLength="1" d="M20 26 C 180 8, 330 40, 520 22 S 860 10, 1000 28 S 1150 30, 1180 20"/>
  </svg>

  <!-- 2. peel it off the sheet and stick it on your things -->
  <section class="sec try" id="try" aria-labelledby="tryTitle">
    <div class="wrap">
      <div class="sec-head rv">
        <span class="eyebrow" data-t="page.tryEyebrow"></span>
        <h2 class="display" id="tryTitle" data-t="page.tryTitle"></h2>
        <p data-t="page.tryText"></p>
      </div>
      <div class="try-grid">
        <div class="sheet-wrap">
          <div class="kiss" id="sheet" role="list" aria-labelledby="sheetLbl"></div>
          <span class="sheet-lbl" id="sheetLbl" data-t="page.sheet"></span>
        </div>
        <div class="desk-wrap">
          <div class="tabs" id="objTabs" role="tablist"></div>
          <div class="desk" id="desk">
            <div class="obj" id="obj">
              <img class="obj-img" id="objImg" alt="" draggable="false">
              <div class="obj-stk" id="objStk"></div>
              <div class="obj-shade" id="objShade" aria-hidden="true"></div>
            </div>
            <span class="desk-hint" id="deskHint"></span>
            <div class="tools" id="tools" hidden>
              <button type="button" data-a="rl" data-tt="page.rotL">↺</button>
              <button type="button" data-a="rr" data-tt="page.rotR">↻</button>
              <button type="button" data-a="sm" data-tt="page.smaller">−</button>
              <button type="button" data-a="bg" data-tt="page.bigger">+</button>
              <button type="button" data-a="rm" data-tt="page.remove">✕</button>
            </div>
          </div>
          <div class="desk-acts">
            <button class="btn" id="orderUsed" type="button"></button>
            <button class="btn btn-ghost" id="saveImg" type="button" data-t="page.save"></button>
            <button class="btn btn-ghost" id="clearAll" type="button" data-t="page.clear"></button>
          </div>
          <p class="digital" data-t="page.digital"></p>
        </div>
      </div>
    </div>
  </section>

  <svg class="stroke" viewBox="0 0 1200 46" preserveAspectRatio="none" aria-hidden="true" style="--c:var(--sage)">
    <path pathLength="1" d="M30 20 C 220 38, 380 6, 600 24 S 940 40, 1170 18"/>
  </svg>

  <!-- 3. the whole collection, catching the light -->
  <section class="sec" id="all">
    <div class="wrap">
      <div class="all-head">
        <div class="sec-head rv">
          <span class="eyebrow" data-t="page.allEyebrow"></span>
          <h2 class="display" data-t="page.allTitle"></h2>
          <p data-t="page.allText"></p>
        </div>
        <div class="finish" role="radiogroup" id="finish">
          <button type="button" role="radio" data-f="gloss" aria-checked="true" data-t="page.glossy"></button>
          <button type="button" role="radio" data-f="matte" aria-checked="false" data-t="page.matte"></button>
        </div>
      </div>
      <div class="stk-grid" id="stkGrid"></div>
      <p class="note" data-t="page.sampleNote"></p>
    </div>
  </section>
</main>

<footer class="foot" id="contact">
  <div class="wrap">
    <div class="foot-grid">
      <div>
        <a class="logo" href="/" aria-label="Mass & Grass"><span class="logo-svg" aria-hidden="true"></span></a>
        <p id="footNote"></p>
      </div>
      <div><h4 data-t="site:ui.browse"></h4><ul id="footCols"></ul></div>
      <div><h4 data-t="site:ui.contactTitle"></h4><ul id="footContact"></ul></div>
    </div>
    <div class="foot-bottom"><span>© <span id="yr"></span> Mass &amp; Grass</span><span id="footTag"></span></div>
  </div>
</footer>


<div class="fly" id="fly" aria-hidden="true"><img alt=""></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/assets/js/watercolor.js"></script>
<script src="/assets/js/shell.js"></script>
<script src="/assets/js/stickers.js"></script>
<script src="/assets/js/search.js"></script>
</body>
</html>
