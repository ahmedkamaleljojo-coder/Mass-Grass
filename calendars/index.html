<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كاليندر ٢٠٢٧ | Mass &amp; Grass</title>
<meta name="description" content="كاليندر ٢٠٢٧ من Mass & Grass: اثنا عشر لوحة مائية وروزنامة البلاد، مع تواريخك إنتِ.">
<link rel="icon" type="image/svg+xml" href="/assets/brand/logo.svg">
<meta name="theme-color" content="#FFFFFF">
<meta name="mg-content" content="calendar">
<meta property="og:title" content="كاليندر ٢٠٢٧ | Mass & Grass">
<meta property="og:description" content="اثنا عشر لوحة مائية وروزنامة البلاد.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/assets/css/main.css">
<link rel="stylesheet" href="/assets/css/calendar.css">
<script>document.documentElement.classList.add('js')</script>
<script src="/assets/js/theme.js"></script>
</head>
<body class="lang-ar" data-page="calendars">

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="rough" x="-10%" y="-40%" width="120%" height="180%">
    <feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="3" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
  </filter>
  <filter id="deckle" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="4" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
  </filter>
</svg>

<header class="site-head">
  <div class="head-in">
    <a class="logo" href="/" aria-label="Mass & Grass">
      <span class="logo-svg" aria-hidden="true"></span>
    </a>
    <nav class="nav" id="nav" aria-label="الأقسام"></nav>
    <div class="head-act">
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Dark mode / الوضع الداكن" aria-pressed="false">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.3 4.3l1.6 1.6M18.1 18.1l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.3 19.7l1.6-1.6M18.1 5.9l1.6-1.6"/></svg>
      </button>
      <button class="lang-btn" id="langBtn" type="button" aria-label="Switch language / تغيير اللغة">EN</button>
      <a class="btn" href="#contact" data-contact></a>
    </div>
  </div>
  <nav class="chips" id="chips" aria-label="الأقسام"></nav>
</header>

<main>
  <!-- 1. the year as a fan of cards: move it left and right, tap a month for its details -->
  <section class="fan-sec" aria-labelledby="yrTitle">
    <div class="wrap fan-head">
      <span class="eyebrow" data-t="page.eyebrow"></span>
      <h1 class="display" id="yrTitle"></h1>
      <p class="lead" data-t="page.lead"></p>
    </div>
    <div class="fan" id="fan" tabindex="0" role="listbox" aria-labelledby="yrTitle"></div>
    <div class="wrap fan-foot">
      <button class="arrow" id="fanPrev" type="button"><span aria-hidden="true">→</span><span class="sr-only" data-t="page.prev"></span></button>
      <div class="fan-cap" aria-live="polite"><b id="fanName"></b><span id="fanFolk"></span></div>
      <button class="arrow" id="fanNext" type="button"><span aria-hidden="true">←</span><span class="sr-only" data-t="page.next"></span></button>
    </div>
    <p class="fan-hint"><span aria-hidden="true">⟷</span> <span data-t="page.fanHint"></span></p>
  </section>

  <!-- 2. the calendar on the wall: the page bends and turns like paper -->
  <section class="wall-sec" id="wall" aria-labelledby="wallTitle">
    <canvas class="fx" id="fx" aria-hidden="true"></canvas>
    <div class="wrap wall-grid">
      <div class="sec-head rv">
        <span class="eyebrow" data-t="page.wallEyebrow"></span>
        <h2 class="display" id="wallTitle" data-t="page.wallTitle"></h2>
        <p data-t="page.wallText"></p>
        <div class="wall-nav">
          <button class="arrow" id="prevBtn" type="button"><span aria-hidden="true">→</span><span class="sr-only" data-t="page.prev"></span></button>
          <button class="arrow" id="nextBtn" type="button"><span aria-hidden="true">←</span><span class="sr-only" data-t="page.next"></span></button>
        </div>
      </div>
      <div class="hang-wrap">
        <!-- the calendar on its own: a real wire-o binding photo on top, paper texture over the live pages -->
        <div class="calendar-w" id="cal">
          <img class="bind" src="/assets/products/calendar/binding.webp" alt="" aria-hidden="true" width="1800" height="143" decoding="async">
          <div class="bind-gap" aria-hidden="true"></div>
          <div class="pages" id="pages">
            <div class="stack" aria-hidden="true"></div>
            <canvas class="pg under" id="pgUnder"></canvas>
            <canvas class="pg front" id="pgTop"></canvas>
            <canvas class="gl" id="gl" aria-hidden="true"></canvas>
            <div class="tex" aria-hidden="true"></div>
          </div>
          <span class="flip-hint" id="flipHint"><span aria-hidden="true">↑</span> <span data-t="page.flipHint"></span></span>
        </div>
      </div>
    </div>
  </section>

  <!-- 3. see it at home -->
  <section class="sec fmt" id="fmt" aria-labelledby="fmtTitle">
    <div class="wrap fmt-grid">
      <div class="sec-head rv">
        <span class="eyebrow" data-t="page.fmtEyebrow"></span>
        <h2 class="display" id="fmtTitle" data-t="page.fmtTitle"></h2>
        <p data-t="page.fmtText"></p>
        <div class="finish" role="tablist" id="fmtTabs">
          <button type="button" role="tab" data-f="wall" aria-selected="true" data-t="page.wall"></button>
          <button type="button" role="tab" data-f="desk" aria-selected="false" data-t="page.desk"></button>
        </div>
      </div>
      <figure class="mock"><canvas id="mockCanvas"></canvas></figure>
    </div>
  </section>

  <svg class="stroke" viewBox="0 0 1200 46" preserveAspectRatio="none" aria-hidden="true" style="--c:var(--ochre)">
    <path pathLength="1" d="M20 26 C 180 8, 330 40, 520 22 S 860 10, 1000 28 S 1150 30, 1180 20"/>
  </svg>

  <!-- 4. build your year: each month's painting from any edition -->
  <section class="sec build" id="build" aria-labelledby="buildTitle">
    <div class="wrap build-grid">
      <div class="sec-head rv">
        <span class="eyebrow" data-t="page.buildEyebrow"></span>
        <h2 class="display" id="buildTitle" data-t="page.buildTitle"></h2>
        <p data-t="page.buildText"></p>
        <div class="whole" id="whole"></div>
      </div>
      <div class="build-box">
        <div class="chosen" id="chosen"></div>
        <p class="sum" id="sum"></p>
        <div class="months-b" id="monthsB"></div>
        <h3 class="dates-h" data-t="page.yourDates"></h3>
        <ul class="dates" id="dates"></ul>
        <div class="mine-acts"><button class="btn" id="orderBtn" type="button"></button></div>
      </div>
    </div>
    <p class="note wrap" data-t="page.sampleNote"></p>
  </section>
</main>

<!-- a month's details -->
<dialog class="md" id="md" aria-labelledby="mdName">
  <div class="md-in">
    <button class="md-x" id="mdX" type="button"><span aria-hidden="true">✕</span><span class="sr-only" data-t="page.cancel"></span></button>
    <figure class="md-art"><img id="mdImg" alt=""></figure>
    <div class="md-body">
      <span class="eyebrow" id="mdNum"></span>
      <h3 class="display" id="mdName"></h3>
      <span class="md-folk" id="mdFolk"></span>
      <p id="mdNote"></p>
      <div class="md-cal" id="mdCal"></div>
      <div class="row">
        <button class="btn" id="mdWall" type="button" data-t="page.seeOnWall"></button>
        <button class="btn btn-ghost" id="mdPrev" type="button"><span aria-hidden="true">→</span><span class="sr-only" data-t="page.prev"></span></button>
        <button class="btn btn-ghost" id="mdNext" type="button"><span aria-hidden="true">←</span><span class="sr-only" data-t="page.next"></span></button>
      </div>
    </div>
  </div>
</dialog>

<!-- add a date -->
<div class="dpop" id="dpop" hidden>
  <b id="dpopDay"></b>
  <input id="dpopText" type="text" maxlength="40" autocomplete="off">
  <div class="dpop-acts">
    <button class="btn" id="dpopAdd" type="button" data-t="page.add"></button>
    <button class="btn btn-ghost" id="dpopDel" type="button" data-t="page.remove"></button>
    <button class="btn btn-ghost" id="dpopX" type="button" data-t="page.cancel"></button>
  </div>
</div>

<footer class="foot" id="contact">
  <div class="wrap">
    <div class="foot-grid">
      <div>
        <a class="logo" href="/" aria-label="Mass & Grass"><span class="logo-svg" aria-hidden="true"></span></a>
        <p id="footNote"></p>
      </div>
      <div><h4 data-t="site:ui.browse"></h4><ul id="footCols"></ul></div>
      <div><h4 data-t="site:ui.contactTitle"></h4><ul id="footContact"></ul></div>
    </div>
    <div class="foot-bottom"><span>© <span id="yr"></span> Mass &amp; Grass</span><span id="footTag"></span></div>
  </div>
</footer>


<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/assets/js/watercolor.js"></script>
<script src="/assets/js/shell.js"></script>
<script src="/assets/js/calendar.js"></script>
</body>
</html>
