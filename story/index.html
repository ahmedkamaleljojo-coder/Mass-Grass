<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الحكاية | Mass &amp; Grass</title>
<meta name="description" content="حكاية فرح، صاحبة Mass &amp; Grass: من الرسم في الرابعة عشرة إلى تقويم النزوح إلى متجر يحمل حجر فلسطين وخضرتها.">
<meta name="theme-color" content="#FFFFFF">
<meta name="mg-content" content="story">
<meta property="og:title" content="الحكاية | Mass &amp; Grass">
<meta property="og:description" content="حكاية فرح وMass &amp; Grass.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Caveat:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/assets/css/main.css">
<link rel="stylesheet" href="/assets/css/story.css">
<script>document.documentElement.classList.add('js')</script>
<script src="/assets/js/theme.js"></script>
</head>
<body class="lang-ar" data-page="story">

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="rough" x="-10%" y="-40%" width="120%" height="180%">
    <feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="3" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
  </filter>
  <filter id="deckle" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="4" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
  </filter>
</svg>

<header class="site-head">
  <div class="head-in">
    <a class="logo" href="/" aria-label="Mass & Grass">
      <canvas class="logo-mark" id="logoMark" width="84" height="84" aria-hidden="true"></canvas>
      <span class="logo-word">Mass <i>&amp;</i> Grass</span>
    </a>
    <nav class="nav" id="nav" aria-label="الأقسام"></nav>
    <div class="head-act">
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Dark mode / الوضع الداكن" aria-pressed="false">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.3 4.3l1.6 1.6M18.1 18.1l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.3 19.7l1.6-1.6M18.1 5.9l1.6-1.6"/></svg>
      </button>
      <button class="lang-btn" id="langBtn" type="button" aria-label="Switch language / تغيير اللغة">EN</button>
      <a class="btn" href="#contact" data-contact></a>
    </div>
  </div>
  <nav class="chips" id="chips" aria-label="الأقسام"></nav>
</header>

<main>
  <!-- 1. Farah, painted -->
  <section class="hero" aria-labelledby="heroTitle">
    <div class="wrap hero-grid">
      <figure class="hero-stage">
        <span class="stage-blot" aria-hidden="true"></span>
        <button class="hero-farah" id="heroFarah" type="button">
          <img class="sizer" id="heroImg" src="/assets/products/story/farah-hello.webp" alt="" fetchpriority="high">
        </button>
        <p class="bubble" id="heroBubble" aria-live="polite"></p>
        <figcaption data-t="hero.portraitCap"></figcaption>
      </figure>
      <div class="hero-copy">
        <span class="eyebrow" data-t="hero.eyebrow"></span>
        <h1 class="display ink" id="heroTitle" data-t="hero.title"></h1>
        <p class="lead ink" data-t="hero.lead"></p>
        <a class="btn btn-ghost down" href="#chapters"><span class="arw" aria-hidden="true">↓</span></a>
      </div>
    </div>
  </section>

  <!-- 2. the story, chapter by chapter -->
  <section class="chapters" id="chapters" aria-label="Story">
    <div class="wrap">
      <ol class="road" id="road"></ol>
    </div>
  </section>

  <svg class="stroke" viewBox="0 0 1200 46" preserveAspectRatio="none" aria-hidden="true" style="--c:var(--plum)">
    <path pathLength="1" d="M20 26 C 180 8, 330 40, 520 22 S 860 10, 1000 28 S 1150 30, 1180 20"/>
  </svg>

  <!-- 3. the name -->
  <section class="sec name" data-pose="stone" data-side="start" data-say="name.say" aria-labelledby="nameTitle">
    <div class="wrap">
      <div class="sec-head center rv">
        <span class="eyebrow" data-t="name.eyebrow"></span>
        <h2 class="display ink" id="nameTitle" data-t="name.title"></h2>
      </div>
      <div class="pair rv">
        <div class="blot mass"><b>Mass</b><span data-t="name.mass"></span><small data-t="name.massSub"></small></div>
        <i class="amp" aria-hidden="true">&amp;</i>
        <div class="blot grass"><b>Grass</b><span data-t="name.grass"></span><small data-t="name.grassSub"></small></div>
      </div>
      <p class="name-text ink" data-t="name.text"></p>
    </div>
  </section>

  <!-- 4. close -->
  <section class="sec close" data-pose="heart" data-side="end" data-say="close.say">
    <div class="wrap rv">
      <blockquote class="ink" data-t="close.text"></blockquote>
      <span class="sign ink" data-t="close.sign"></span>
      <a class="btn" href="/calendars/"><span data-t="close.cta"></span><span class="arw" aria-hidden="true">←</span></a>
    </div>
  </section>
</main>

<footer class="foot" id="contact">
  <div class="wrap">
    <div class="foot-grid">
      <div>
        <a class="logo" href="/" aria-label="Mass & Grass"><span class="logo-word">Mass <i>&amp;</i> Grass</span></a>
        <p id="footNote"></p>
      </div>
      <div><h4 data-t="site:ui.browse"></h4><ul id="footCols"></ul></div>
      <div><h4 data-t="site:ui.contactTitle"></h4><ul id="footContact"></ul></div>
    </div>
    <div class="foot-bottom"><span>© <span id="yr"></span> Mass &amp; Grass</span><span id="footTag"></span></div>
  </div>
</footer>


<!-- Farah, a paper cut-out who walks down the page with the story -->
<div class="farah" id="farah" aria-hidden="true">
  <div class="farah-hop"><button class="farah-card" id="farahCard" type="button" tabindex="-1"></button></div>
  <p class="bubble" id="bubble"></p>
</div>

<i class="nib" id="nib" aria-hidden="true"></i>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/assets/js/watercolor.js"></script>
<script src="/assets/js/shell.js"></script>
<script src="/assets/js/paperfold.js"></script>
<script src="/assets/js/story.js"></script>
</body>
</html>
