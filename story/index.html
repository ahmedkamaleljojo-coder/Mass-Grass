<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الحكاية | Mass &amp; Grass</title>
<meta name="description" content="حكاية فرح على خريطة غزة: من بيتها في الجلاء، إلى النزوح والعودة، إلى مكتب صغير بدأت منه Mass &amp; Grass.">
<link rel="icon" type="image/svg+xml" href="/assets/brand/logo.svg">
<meta name="theme-color" content="#F2EFE8">
<meta name="mg-content" content="story">
<link rel="canonical" href="https://www.massandgrass.com/story/">
<meta property="og:url" content="https://www.massandgrass.com/story/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Mass &amp; Grass">
<meta property="og:image" content="https://www.massandgrass.com/assets/products/story/portrait-farah.webp">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:title" content="الحكاية | Mass &amp; Grass">
<meta property="og:description" content="حكاية فرح وMass &amp; Grass.">
<link rel="preload" href="/assets/fonts/ibm-plex-sans-arabic-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/main.css">
<link rel="stylesheet" href="/assets/css/story.css">
<script>document.documentElement.classList.add('js')</script>
<script src="/assets/js/theme.js"></script>
</head>
<body class="lang-ar" data-page="story">

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="rough" x="-10%" y="-40%" width="120%" height="180%">
    <feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="3" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
  </filter>
  <filter id="deckle" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="4" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
  </filter>
</svg>

<header class="site-head" id="siteHead">
  <div class="brand-row">
    <div class="head-start">
      <button class="menu-btn" id="menuBtn" type="button" aria-controls="menu" aria-expanded="false" aria-label="القائمة / Menu"><span></span><span></span><span></span></button>
      <a class="head-link" href="/story/" data-t="site:ui.story"></a>
    </div>
    <a class="logo" href="/" aria-label="Mass & Grass"><span class="logo-svg" aria-hidden="true"></span></a>
    <div class="head-end">
      <button class="lang-btn" id="langBtn" type="button" aria-label="Switch language / تغيير اللغة">EN</button>
    </div>
  </div>
</header>
<nav class="nav-row" id="navRow" aria-label="الأقسام">
  <div class="nav-row-in">
    <a class="nav-mark" href="/" aria-label="Mass & Grass" tabindex="-1"><span class="logo-svg" aria-hidden="true"></span></a>
    <div class="nav" id="nav"></div>
  </div>
</nav>

<main>
  <!-- 1. hero -->
  <section class="hero" aria-labelledby="heroTitle">
    <div class="wrap hero-grid">
      <figure class="hero-portrait">
        <img id="heroImg" src="/assets/products/story/portrait-farah.webp" width="680" height="680" alt="" fetchpriority="high">
      </figure>
      <div class="hero-copy">
        <span class="eyebrow" data-t="hero.eyebrow"></span>
        <h1 class="display" id="heroTitle" data-t="hero.title"></h1>
        <p class="lead" data-t="hero.lead"></p>
        <a class="btn" href="#journey"><span data-t="hero.start"></span><span class="arw" aria-hidden="true">↓</span></a>
      </div>
    </div>
  </section>

  <!-- 2. the journey: the map stays, the story scrolls past it -->
  <section class="gz-journey" id="journey" aria-label="Farah's journey across Gaza">
    <div class="map-pane">
      <div class="map" id="map">
        <svg id="mapSvg" viewBox="0 0 800 1000" role="img" aria-labelledby="mapTitle">
          <title id="mapTitle"></title>
          <defs>
            <filter id="wash" x="-10%" y="-10%" width="120%" height="120%">
              <feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="3" seed="7" result="n"/>
              <feDisplacementMap in="SourceGraphic" in2="n" scale="9"/>
            </filter>
            <filter id="grain">
              <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/>
              <feColorMatrix values="0 0 0 0 .42  0 0 0 0 .33  0 0 0 0 .24  0 0 0 .16 0"/>
              <feComposite in2="SourceGraphic" operator="in"/>
            </filter>
            <clipPath id="faceClip" clipPathUnits="objectBoundingBox"><circle cx=".5" cy=".5" r=".5"/></clipPath>
          </defs>
          <g id="world"></g>
        </svg>
        <p class="map-note" id="mapNote" aria-live="polite"></p>
      </div>
    </div>
    <ol class="j-steps" id="steps"></ol>
  </section>

  <svg class="stroke" viewBox="0 0 1200 46" preserveAspectRatio="none" aria-hidden="true" style="--c:var(--sage)">
    <path pathLength="1" d="M20 26 C 180 8, 330 40, 520 22 S 860 10, 1000 28 S 1150 30, 1180 20"/>
  </svg>

  <!-- 3. the name -->
  <section class="sec name" aria-labelledby="nameTitle">
    <div class="wrap">
      <div class="sec-head center rv">
        <span class="eyebrow" data-t="name.eyebrow"></span>
        <h2 class="display" id="nameTitle" data-t="name.title"></h2>
      </div>
      <div class="pair rv">
        <div class="blot mass"><b>Mass</b><span data-t="name.mass"></span><small data-t="name.massSub"></small></div>
        <i class="amp" aria-hidden="true">&amp;</i>
        <div class="blot grass"><b>Grass</b><span data-t="name.grass"></span><small data-t="name.grassSub"></small></div>
      </div>
      <p class="name-text rv" data-t="name.text"></p>
    </div>
  </section>

  <!-- 4. close -->
  <section class="sec close">
    <div class="wrap rv">
      <blockquote data-t="close.text"></blockquote>
      <span class="sign" data-t="close.sign"></span>
    </div>
  </section>

  <!-- 5. the two of them -->
  <section class="sec people" aria-labelledby="peopleTitle">
    <div class="wrap">
      <div class="sec-head center rv">
        <span class="eyebrow" data-t="people.eyebrow"></span>
        <h2 class="display" id="peopleTitle" data-t="people.title"></h2>
      </div>
      <div class="people-grid" id="people"></div>
    </div>
  </section>

  <!-- 6. support the story -->
  <section class="sec support" id="support" aria-labelledby="supTitle">
    <div class="wrap">
      <div class="sup-card rv">
        <div class="sup-faces" aria-hidden="true"><img src="/assets/products/story/face-farah-joy.webp" alt=""></div>
        <span class="eyebrow" data-t="support.eyebrow"></span>
        <h2 class="display" id="supTitle" data-t="support.title"></h2>
        <p data-t="support.text"></p>
        <ul class="sup-ways" id="supWays"></ul>
        <div class="sup-acts" id="supActs"></div>
        <small class="sup-note" data-t="support.note"></small>
      </div>
    </div>
  </section>
</main>

<footer class="foot" id="contact">
  <div class="wrap foot-in">
    <a class="logo" href="/" aria-label="Mass & Grass"><span class="logo-svg" aria-hidden="true"></span></a>
    <p class="foot-note" id="footNote"></p>
    <nav class="foot-nav" id="footCols" aria-label="الأقسام"></nav>
    <ul class="foot-contact" id="footContact"></ul>
    <div class="foot-bottom">
      <span>© <span id="yr"></span> Mass &amp; Grass</span>
      <button class="theme-toggle" id="themeBtn" data-theme-toggle type="button" aria-label="Dark mode / الوضع الداكن" aria-pressed="false">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.3 4.3l1.6 1.6M18.1 18.1l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.3 19.7l1.6-1.6M18.1 5.9l1.6-1.6"/></svg>
      </button>
    </div>
  </div>
</footer>


<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/assets/js/watercolor.js"></script>
<script src="/assets/js/shell.js"></script>
<script src="/assets/js/story.js"></script>
</body>
</html>
