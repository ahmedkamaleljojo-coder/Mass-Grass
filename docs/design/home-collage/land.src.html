<!doctype html><html dir="rtl"><head><meta charset="utf-8"><style>
/*FONTS*/
body{margin:0;background:#E9E5DD;font-family:"IBM Plex Sans Arabic";padding:30px;display:grid;grid-template-columns:repeat(4,1fr);gap:24px;width:1900px;direction:ltr}
.f{position:relative;aspect-ratio:16/10;overflow:hidden;background:#F6F3ED url({{paper}}) 0 0/700px repeat;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.n{position:absolute;top:10px;left:12px;font-family:Caveat;font-size:22px;color:rgba(58,52,46,.6)}
.cap{text-align:center;font-family:"Aref Ruqaa";font-size:22px;color:#2B3A55;margin-top:8px}
.sheet{position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1/1.1;translate:-50% -50%;background:#FBFAF7;box-shadow:0 1px 1px rgba(60,45,30,.1),0 18px 30px -16px rgba(60,45,30,.4);display:grid;place-items:center}
.logo{width:42%;aspect-ratio:25/20;background:#3B302A;-webkit-mask:url({{logo}}) center/contain no-repeat}
.half{position:absolute;left:50%;top:50%;width:52%;translate:-50% -50%;filter:drop-shadow(0 16px 18px rgba(60,45,30,.25))}
.half-logo{position:absolute;left:50%;top:50%;width:16%;aspect-ratio:25/20;translate:-50% -52%;background:#3B302A;-webkit-mask:url({{logo}}) center/contain no-repeat;transform:rotate(-6deg) skewX(8deg) scaleY(.85);opacity:.75}
.home{position:absolute;inset:0;background:url({{home}}) center/cover}
.ball{position:absolute;width:16%;filter:drop-shadow(0 12px 12px rgba(60,45,30,.3))}
.trail{position:absolute;fill:none;stroke:rgba(58,52,46,.35);stroke-width:2;stroke-dasharray:3 7}
</style></head><body>
<div><div class="f"><div class="sheet"><span class="logo"></span></div><span class="n">1</span></div><p class="cap">ورقة عليها الشعار تملأ الشاشة</p></div>
<div><div class="f"><img class="half" src="{{half}}"><span class="half-logo"></span><span class="n">2</span></div><p class="cap">تنكمش الورقة بين يدين خفيّتين</p></div>
<div><div class="f"><div class="home" style="opacity:.55"></div><svg class="trail" viewBox="0 0 400 250" style="inset:0;width:100%;height:100%"><path d="M200 140 C 250 60, 320 40, 370 80"/></svg><img class="ball" src="{{ball}}" style="left:76%;top:18%;transform:rotate(30deg)"><span class="n">3</span></div><p class="cap">تُرمى الكرة جانباً وتظهر الصفحة</p></div>
<div><div class="f"><div class="home"></div><img class="ball" src="{{ball}}" style="width:7%;left:2%;top:80%;transform:rotate(80deg)"><span class="n">4</span></div><p class="cap">الصفحة الرئيسية، والكرة تبقى في الزاوية</p></div>
</body></html>
