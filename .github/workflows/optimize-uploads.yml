# Images added from the content panel are made web-ready (WebP, at most 2000 px)
# and the content files are pointed at the new files (also when a content file is
# saved later and still names the original upload). The commit made here does not
# start this workflow again; Cloudflare Pages redeploys the site from it.
name: Optimise uploaded images

on:
  push:
    branches: [main]
    paths: ["assets/uploads/**", "content/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimise-uploads
  cancel-in-progress: false

jobs:
  optimise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow pillow-heif
      - run: python tools/optimize_uploads.py
      - name: Commit the web images
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A assets/uploads content
            git commit -m "Optimise uploaded images"
            git pull --rebase
            git push
          fi
