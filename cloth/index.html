<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الملابس والحقائب | Mass &amp; Grass</title>
<meta name="description" content="هودي وسويت شيرت وحقائب قماشية وقبعات بطبعات من رسومات Mass &amp; Grass المائية.">
<link rel="icon" type="image/svg+xml" href="/assets/brand/logo.svg">
<meta name="theme-color" content="#F2EFE8">
<meta name="mg-content" content="cloth,paintings">
<link rel="canonical" href="https://www.massandgrass.com/cloth/">
<meta property="og:url" content="https://www.massandgrass.com/cloth/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Mass &amp; Grass">
<meta property="og:image" content="https://www.massandgrass.com/assets/products/hoodies/looks/m1-stand-sand.webp">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:title" content="الملابس والحقائب | Mass &amp; Grass">
<meta property="og:description" content="رسوماتنا المائية مطبوعة على القطن.">
<link rel="preload" href="/assets/fonts/ibm-plex-sans-arabic-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/main.css">
<link rel="stylesheet" href="/assets/css/cloth.css">
<script>document.documentElement.classList.add('js')</script>
<script src="/assets/js/theme.js"></script>
</head>
<body class="lang-ar" data-page="cloth">

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="rough" x="-10%" y="-40%" width="120%" height="180%">
    <feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="3" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
  </filter>
  <filter id="deckle" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="4" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
  </filter>
</svg>

<header class="site-head" id="siteHead">
  <div class="brand-row">
    <div class="head-start">
      <button class="menu-btn" id="menuBtn" type="button" aria-controls="menu" aria-expanded="false" aria-label="القائمة / Menu"><span></span><span></span><span></span></button>
      <a class="head-link" href="/story/" data-t="site:ui.story"></a>
    </div>
    <a class="logo" href="/" aria-label="Mass & Grass"><span class="logo-svg" aria-hidden="true"></span></a>
    <div class="head-end">
      <button class="lang-btn" id="langBtn" type="button" aria-label="Switch language / تغيير اللغة">EN</button>
    </div>
  </div>
</header>
<nav class="nav-row" id="navRow" aria-label="الأقسام">
  <div class="nav-row-in">
    <a class="nav-mark" href="/" aria-label="Mass & Grass" tabindex="-1"><span class="logo-svg" aria-hidden="true"></span></a>
    <div class="nav" id="nav"></div>
  </div>
</nav>

<main>
  <section class="wr" id="wr" aria-labelledby="wrTitle">
    <div class="wrap wr-head">
      <div>
        <span class="eyebrow" data-t="page.eyebrow"></span>
        <h1 class="display" id="wrTitle" data-t="page.title"></h1>
        <p class="wr-lead" data-t="page.lead"></p>
      </div>
      <div class="wr-count" id="count"></div>
    </div>
    <!-- the kinds of piece: each jumps to its part of the line -->
    <div class="wrap"><div class="kinds" id="kinds" role="tablist"></div></div>

    <!-- the line: drag it left and right; the piece in the middle grows -->
    <div class="line-stage">
      <div class="ghost" id="ghost" aria-hidden="true"></div>
      <div class="line" id="line" role="tablist" tabindex="0"></div>
    </div>

    <div class="meta wrap">
      <!-- the chosen piece, worn -->
      <figure class="look-card">
        <div class="look" id="look" role="img">
          <div class="lens" id="lens" aria-hidden="true"><canvas></canvas>
            <span class="lens-tag"><span class="t-art" data-t="page.lensArt"></span><span class="t-fab" data-t="page.lensFabric"></span></span></div>
        </div>
      </figure>

      <div class="info" aria-live="polite">
        <span class="kick" id="kick"></span>
        <h2 class="display" id="name"></h2>
        <p class="story" id="story"></p>
        <div class="opt">
          <span class="opt-l"><span data-t="page.color"></span>: <b id="colorName"></b></span>
          <div class="swatches" id="swatches" role="radiogroup"></div>
        </div>
        <div class="opt">
          <span class="opt-l"><span data-t="page.pickArt"></span>: <b id="artName"></b></span>
          <div class="arts" id="arts" role="radiogroup"></div>
        </div>
        <p class="digital"><b data-t="page.youGet"></b> <span id="formats"></span></p>
        <div class="acts">
          <a class="btn" id="orderBtn" href="#order"><span data-t="page.order"></span></a>
          <button class="btn btn-ghost" id="detailBtn" type="button" data-t="page.details"></button>
        </div>
        <div class="nav-arrows">
          <button class="arrow" id="prevBtn" type="button"><span aria-hidden="true">→</span><span class="sr-only" data-t="page.prev"></span></button>
          <button class="arrow" id="nextBtn" type="button"><span aria-hidden="true">←</span><span class="sr-only" data-t="page.next"></span></button>
          <span class="timer" aria-hidden="true"><i id="timerBar"></i></span>
        </div>
      </div>

      <button class="print-card" id="printCard" type="button">
        <span class="pc-paper"><canvas id="printCanvas" width="520" height="520"></canvas></span>
        <span class="pc-cap"><span data-t="page.artwork"></span><i data-t="page.zoom"></i></span>
      </button>
    </div>
  </section>

  <svg class="stroke" viewBox="0 0 1200 46" preserveAspectRatio="none" aria-hidden="true" style="--c:var(--umber)">
    <path pathLength="1" d="M20 26 C 180 8, 330 40, 520 22 S 860 10, 1000 28 S 1150 30, 1180 20"/>
  </svg>

  <section class="sec" id="collection">
    <div class="wrap">
      <div class="sec-head rv">
        <span class="eyebrow" data-t="page.allEyebrow"></span>
        <h2 class="display" data-t="page.allTitle"></h2>
        <p data-t="page.allText"></p>
      </div>
      <div class="cards" id="cards"></div>
    </div>
  </section>
</main>

<footer class="foot" id="contact">
  <div class="wrap foot-in">
    <a class="logo" href="/" aria-label="Mass & Grass"><span class="logo-svg" aria-hidden="true"></span></a>
    <p class="foot-note" id="footNote"></p>
    <nav class="foot-nav" id="footCols" aria-label="الأقسام"></nav>
    <ul class="foot-contact" id="footContact"></ul>
    <div class="foot-bottom">
      <span>© <span id="yr"></span> Mass &amp; Grass</span>
      <button class="theme-toggle" id="themeBtn" data-theme-toggle type="button" aria-label="Dark mode / الوضع الداكن" aria-pressed="false">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.3 4.3l1.6 1.6M18.1 18.1l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.3 19.7l1.6-1.6M18.1 5.9l1.6-1.6"/></svg>
      </button>
    </div>
  </div>
</footer>

<!-- painting + piece side by side -->
<dialog class="lb" id="lb" aria-labelledby="lbName">
  <div class="lb-in">
    <button class="lb-x" id="lbClose" type="button"><span aria-hidden="true">✕</span><span class="sr-only" data-t="page.close"></span></button>
    <div class="lb-panes">
      <figure class="lb-pane art"><span class="tag" data-t="page.artwork"></span><span class="lb-paper"><img id="lbArt" alt=""></span></figure>
      <figure class="lb-pane worn"><span class="tag" id="lbTag"></span><span class="lb-main"><img id="lbPiece" alt=""></span></figure>
    </div>
    <div class="lb-body">
      <span class="kick" id="lbKick"></span>
      <h3 class="display" id="lbName"></h3>
      <p id="lbStory"></p>
      <dl class="specs" id="lbSpecs"></dl>
      <p class="note" id="lbNote"></p>
      <a class="btn" id="lbOrder" href="#order"><span data-t="page.order"></span></a>
    </div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/assets/js/watercolor.js"></script>
<script src="/assets/js/shell.js"></script>
<script src="/assets/js/cloth.js"></script>
</body>
</html>
